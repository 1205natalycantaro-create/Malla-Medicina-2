*{

body{

}

aside{

width:320px;

border-radius:10px;

border-left:6px solid #4CAF50;

}

.course:hover{

transform:translateY(-2px);

}

.course.locked{

background:#dddddd;
border-left:6px solid #999;
cursor:not-allowed;

}

.course.completed{

background:#b9f6ca;
border-left:6px solid #009688;

}

.course h4{

font-size:15px;

}

.course small{

}

.tooltip{

position:absolute;
bottom:105%;
left:0;
background:#222;
color:white;
padding:8px;
border-radius:8px;
font-size:12px;
display:none;
z-index:100;

}

.course.locked:hover .tooltip{

display:block;

}

<script>

const courses=[];

let state={};

function save(){

localStorage.setItem("medicina_estado",JSON.stringify(state));

}

function load(){

const s=localStorage.getItem("medicina_estado");

if(s){

state=JSON.parse(s);

}

}

function approved(id){

return state[id]===true;

}

function updateProgress(){

let total=courses.length;

let done=0;

let credits=0;

courses.forEach(c=>{

if(approved(c.id)){

done++;

credits+=c.credits;

}

});

document.getElementById("credits").innerHTML=credits;

let p=Math.round(done*100/total);

document.getElementById("percent").innerHTML=p+"%";

document.getElementById("bar").style.width=p+"%";

save();

}
function requirementsMet(course){

    if(!course.prereq || course.prereq.length===0){
        return true;
    }

    for(const req of course.prereq){

        if(req==="ENGLISH_A2"){

            if(!document.getElementById("englishA2").checked){
                return false;
            }

        }

        else if(req==="ENGLISH_B2"){

            if(!document.getElementById("englishB2").checked){
                return false;
            }

        }

        else if(req==="MEDICAL_EXAM"){

            if(!document.getElementById("medicalExam").checked){
                return false;
            }

        }

        else if(req==="ELECTIVE_8"){

            const e=parseInt(document.getElementById("electiveCredits").value)||0;

            if(e<8){
                return false;
            }

        }

        else{

            if(!approved(req)){
                return false;
            }

        }

    }

    return true;

}

function missingRequirements(course){

    let list=[];

    if(!course.prereq) return list;

    course.prereq.forEach(req=>{

        if(req==="ENGLISH_A2"){

            if(!document.getElementById("englishA2").checked){

                list.push("Inglés A2");

            }

        }

        else if(req==="ENGLISH_B2"){

            if(!document.getElementById("englishB2").checked){

                list.push("Inglés B2");

            }

        }

        else if(req==="MEDICAL_EXAM"){

            if(!document.getElementById("medicalExam").checked){

                list.push("Examen de suficiencia médica");

            }

        }

        else if(req==="ELECTIVE_8"){

            const e=parseInt(document.getElementById("electiveCredits").value)||0;

            if(e<8){

                list.push("8 créditos electivos");

            }

        }

        else{

            if(!approved(req)){

                const c=courses.find(x=>x.id===req);

                if(c){

                    list.push(c.name);

                }

            }

        }

    });

    return list;

}

function uncheckDependents(id){

    courses.forEach(c=>{

        if(c.prereq && c.prereq.includes(id)){

            if(state[c.id]){

                state[c.id]=false;

                uncheckDependents(c.id);

            }

        }

    });

}

function render(){

    const grid=document.getElementById("grid");

    grid.innerHTML="";

    const grouped={};

    courses.forEach(c=>{

        if(!grouped[c.cycle]){

            grouped[c.cycle]=[];

        }

        grouped[c.cycle].push(c);

    });

    Object.keys(grouped).forEach(cycle=>{

        const column=document.createElement("div");

        column.className="column";

        const title=document.createElement("h2");

        title.innerHTML="Ciclo "+cycle;

        column.appendChild(title);

        grouped[cycle].forEach(course=>{

            const card=document.createElement("div");

            card.className="course";

            const enabled=requirementsMet(course);

            if(!enabled){

                card.classList.add("locked");

            }

            if(approved(course.id)){

                card.classList.add("completed");

            }

            card.innerHTML=`

            <h4>${course.name}</h4>

            <small>${course.credits} créditos</small>

            `;

            if(!enabled){

                const tip=document.createElement("div");

                tip.className="tooltip";

                tip.innerHTML="Falta aprobar:<br>"+missingRequirements(course).join("<br>");

                card.appendChild(tip);

            }

            card.onclick=()=>{

                if(!requirementsMet(course)){

                    return;

                }

                if(state[course.id]){

                    state[course.id]=false;

                    uncheckDependents(course.id);

                }

                else{

                    state[course.id]=true;

                }

                updateProgress();

                render();

            };

            column.appendChild(card);

        });

        grid.appendChild(column);

    });

}
